name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.img.outputs.image }}
    steps:
      - id: img
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "image=ghcr.io/${REPO,,}/ci:latest" >> "$GITHUB_OUTPUT"



  kmod:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    steps:
      - name: Download prebuilt kmod from backend repo
        run: |
          mkdir -p kmod-artifacts
          BACKEND_RELEASE_TAG=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # A public APK tag and the matching private tag describe one
            # release set. Component versions inside that set may differ
            # (for example APK 2.5.4 with kmod 2.5.3), so never substitute
            # the backend's newest release while cutting a tagged APK.
            BACKEND_RELEASE_TAG=("$GITHUB_REF_NAME")
          fi
          gh release download "${BACKEND_RELEASE_TAG[@]}" --repo soranerai/vpnhide_next_backend \
            -p "vpnhide-kmod-${{ matrix.kmi }}.zip" \
            -D kmod-artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpnhide-kmod-${{ matrix.kmi }}
          path: kmod-artifacts/vpnhide-kmod-${{ matrix.kmi }}.zip
          if-no-files-found: warn

  # Runtime kernel-module/QEMU tests run in the private backend repository.

  lsposed:
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.setup.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mark workspace safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install python3 if missing
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends python3
          fi

      - name: Verify generated compatibility matrix
        run: |
          python3 scripts/codegen-compatibility.py
          git diff --exit-code -- lsposed/app/src/main/kotlin/dev/soranerai/vpnhidenext/generated/CompatibilityMatrix.kt

      # Gradle cache (deps + configuration cache + wrapper). cache-read-only
      # on PRs so only main pushes write the cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Cache Rust dependencies and Android cdylib
        uses: actions/cache@v5
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/git
            lsposed/native/target
          key: cargo-${{ runner.os }}-native-${{ hashFiles('lsposed/native/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-native-

      - name: Set up keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/lsposed/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          else
            echo "ANDROID_KEYSTORE_BASE64 is empty (fork PR); generating an ephemeral keystore. Resulting APK is signed with a throwaway key and is NOT suitable for release."
            KEYSTORE_PASSWORD=ephemeral
            KEY_ALIAS=ephemeral
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 365 \
              -dname "CN=vpnhide-fork-ci, O=vpnhide, C=US"
          fi
          # Build via printf — `%s` swallows the value verbatim with no
          # shell expansion of $, backticks, backslashes, or `!`. Heredoc
          # without single-quoted EOF would re-expand each line.
          {
            printf 'password=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=%s\n' "$KEYSTORE_PATH"
          } > "$GITHUB_WORKSPACE/lsposed/keystore.properties"

      # Release tags get the full assembleRelease (R8/ProGuard, signed APK
      # ready for the GitHub release). PRs and main pushes get assembleDebug
      # — same code paths exercised, no R8 step (~1.5–2 min faster).
      # `case` instead of `[[`: container jobs default to /bin/sh (POSIX).
      - name: Build APK
        run: |
          cd "$GITHUB_WORKSPACE/lsposed"
          # The Gobley cargo plugin compiles libvpnhide_checks.so from
          # ../native and packages it into the APK; no backend download.
          case "$GITHUB_REF" in
            refs/tags/v*)
              ./gradlew assembleRelease
              cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/vpnhide.apk"
              ;;
            *)
              ./gradlew assembleRelease
              cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/vpnhide.apk"
              ;;
          esac
          python3 "$GITHUB_WORKSPACE/scripts/verify-uniffi-exports.py" "$GITHUB_WORKSPACE/vpnhide.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vpnhide-apk
          path: vpnhide.apk
          if-no-files-found: error


  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Download prebuilt bridge from backend repo
        run: |
          mkdir -p bridge-artifacts
          BACKEND_RELEASE_TAG=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # The bridge belongs to the same private release set as the APK.
            BACKEND_RELEASE_TAG=("$GITHUB_REF_NAME")
          fi
          if ! gh release download "${BACKEND_RELEASE_TAG[@]}" --repo soranerai/vpnhide_next_backend \
            -p "vpnhide-bridge.zip" \
            -D bridge-artifacts; then
            echo "⚠ bridge artifact is unavailable; continuing without it"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpnhide-bridge
          path: bridge-artifacts/vpnhide-bridge.zip
          if-no-files-found: warn


  release:
    needs: [kmod, lsposed, bridge]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Only the release job needs write — used by softprops/action-gh-release
    # below to create the draft GitHub release. lint/build jobs run on the
    # workflow-level `contents: read`.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        run: |
          TAG="${{ github.ref_name }}"
          awk -v t="^## ${TAG}\$" '$0~t{flag=1;next} /^## v/{flag=0} flag' \
            CHANGELOG.md > release-notes.md
          echo "=== release-notes.md ==="
          cat release-notes.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          draft: true
          files: |
            dist/*.zip
            dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
